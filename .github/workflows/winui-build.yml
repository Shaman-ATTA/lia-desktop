name: WinUI Build & Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prefer .NET 8 SDK (WinAppSDK PriGen breaks on SDK 9+)
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramFiles\dotnet\sdk" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(9|10|11)\.' } |
            ForEach-Object {
              Write-Host "Removing SDK $($_.Name) to avoid PriGen MSB4062"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          dotnet --list-sdks
          dotnet --version

      - uses: microsoft/setup-msbuild@v2

      - name: Unit tests
        run: dotnet test LiaDesktop.WinUI/tests/LiaDesktop.Tests/LiaDesktop.Tests.csproj -c Release --nologo

      - name: Publish unpackaged self-contained
        shell: pwsh
        run: |
          # VS MSBuild ships AppxPackage/Pri tasks that the .NET SDK host lacks (MSB4062).
          $proj = "LiaDesktop.WinUI\src\LiaDesktop\LiaDesktop.csproj"
          $out = Join-Path $PWD "publish\LiaDesktop"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          msbuild $proj `
            /restore `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:TargetFramework=net8.0-windows10.0.19041.0 `
            /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:EnableMsixTooling=false `
            /p:PublishReadyToRun=false `
            /p:PublishDir="$out\" `
            /p:PublishProtocol=FileSystem `
            /v:m
          if (-not (Test-Path (Join-Path $out "LiaDesktop.exe"))) {
            Get-ChildItem $out -ErrorAction SilentlyContinue | Select-Object -First 40
            throw "LiaDesktop.exe missing after publish"
          }
          Get-ChildItem $out | Select-Object Name,Length | Format-Table
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'

      - name: Install Playwright browsers
        run: |
          cd publish/LiaDesktop
          ./LiaDesktop.exe --help 2>$null; exit 0
        continue-on-error: true

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path publish/LiaDesktop/* -DestinationPath LiaDesktop-0.3.0-win-x64.zip -Force
          Get-Item LiaDesktop-0.3.0-win-x64.zip | Format-List Name,Length

      - name: Smoke launch + screenshots + clean exit proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path $PWD 'publish/LiaDesktop/LiaDesktop.exe'
          if (-not (Test-Path $exe)) { throw "exe missing: $exe" }

          $before = Join-Path $PWD 'tasklist_before.txt'
          $after = Join-Path $PWD 'tasklist_after.txt'
          $shot1 = Join-Path $PWD 'desktop_winui_front.png'
          $shot2 = Join-Path $PWD 'desktop_winui_rings.png'

          "=== BEFORE LAUNCH ===" | Out-File $before
          tasklist | Select-String -Pattern 'LiaDesktop|chrome|msedge|python' | Out-File $before -Append

          $bootLog = Join-Path $env:LOCALAPPDATA 'LiaDesktop\boot.log'
          if (Test-Path $bootLog) { Remove-Item $bootLog -Force }

          $p = Start-Process -FilePath $exe -PassThru -WorkingDirectory (Split-Path $exe)
          $alive = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "LiaDesktop exited early code=$($p.ExitCode) after $($i+1)s"
              if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
              Get-ChildItem (Split-Path $exe) -Filter '*.dll' | Select-Object -First 5 Name
              throw "LiaDesktop.exe exited before smoke window (exit $($p.ExitCode))"
            }
            $proc = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
            if ($proc) { $alive = $true; break }
          }
          if (-not $alive) { throw "LiaDesktop process not found" }
          Start-Sleep -Seconds 12

          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class Win {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          }
          [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }
          "@

          $script:hwnd = [IntPtr]::Zero
          $targetPid = [uint32]$p.Id
          for ($try = 0; $try -lt 10 -and $script:hwnd -eq [IntPtr]::Zero; $try++) {
            [Win]::EnumWindows({
              param($h,$l)
              $outPid = [uint32]0
              [void][Win]::GetWindowThreadProcessId($h, [ref]$outPid)
              if ($outPid -ne $targetPid) { return $true }
              if (-not [Win]::IsWindowVisible($h)) { return $true }
              $script:hwnd = $h
              return $false
            }, [IntPtr]::Zero)
            if ($script:hwnd -eq [IntPtr]::Zero) { Start-Sleep -Seconds 1 }
          }
          Write-Host "hwnd=$($script:hwnd) pid=$targetPid"
          if ($script:hwnd -eq [IntPtr]::Zero) {
            if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
            throw "No visible window for LiaDesktop"
          }

          [void][Win]::ShowWindow($script:hwnd, 3)
          Start-Sleep -Milliseconds 500
          [void][Win]::SetForegroundWindow($script:hwnd)
          Start-Sleep -Seconds 4

          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Capture($path) {
            $rect = New-Object RECT
            if ([Win]::GetWindowRect($script:hwnd, [ref]$rect)) {
              $w = [Math]::Max(100, $rect.R - $rect.L)
              $h = [Math]::Max(100, $rect.B - $rect.T)
              $bmp = New-Object System.Drawing.Bitmap $w, $h
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($rect.L, $rect.T, 0, 0, (New-Object System.Drawing.Size $w,$h))
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              Write-Host "captured window $($rect.L),$($rect.T) ${w}x${h} -> $path"
            } else {
              throw "GetWindowRect failed"
            }
          }
          Capture $shot1
          Start-Sleep -Seconds 2
          Capture $shot2

          "=== WHILE RUNNING ===" | Out-File $after
          tasklist | Select-String -Pattern 'LiaDesktop|chrome|msedge|python' | Out-File $after -Append
          if (-not (tasklist | Select-String -Pattern 'LiaDesktop')) {
            if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
            throw "LiaDesktop not in tasklist while smoke expected it running"
          }
          if (Test-Path $bootLog) {
            "`n=== BOOT LOG ===" | Out-File $after -Append
            Get-Content $bootLog | Out-File $after -Append
          }

          # Graceful close via WM_CLOSE
          if ($script:hwnd -ne [IntPtr]::Zero) {
            [void][Win]::PostMessage($script:hwnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) # WM_CLOSE
          } else {
            $p.CloseMainWindow() | Out-Null
          }
          Start-Sleep -Seconds 8
          if (-not $p.HasExited) { try { $p.Kill($true) } catch {} }

          Start-Sleep -Seconds 3
          "`n=== AFTER CLOSE ===" | Out-File $after -Append
          $left = tasklist | Select-String -Pattern 'LiaDesktop|Lia Assistant'
          $left | Out-File $after -Append
          if ($left) {
            Write-Warning "Leftover Lia processes:`n$left"
            if ($left -match 'LiaDesktop') { throw "LiaDesktop still running after close" }
          } else {
            "OK: no LiaDesktop processes remain" | Out-File $after -Append
          }
          Write-Host "smoke ok shots=$([IO.File]::Exists($shot1))"
          Get-Content $after

      # Actions artifact storage may be over quota — never fail the job on that.
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: winui-smoke-${{ github.run_id }}
          path: |
            LiaDesktop-0.3.0-win-x64.zip
            desktop_winui_front.png
            desktop_winui_rings.png
            tasklist_before.txt
            tasklist_after.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload release assets (tags)
        if: always() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          Lia Desktop **v0.3.0** — WinUI 3 + DirectX 11 (ATTA CORP)

          - Unpackaged self-contained `LiaDesktop.exe`
          - DX11 hologram + real 3D torus rings
          - Gemini ListModels / 404 / 503 resilience
          - Job Object clean exit (see `tasklist_after.txt`)
          EOF
          )
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Lia Desktop $TAG" --notes "$NOTES"
          for f in LiaDesktop-0.3.0-win-x64.zip desktop_winui_front.png desktop_winui_rings.png tasklist_before.txt tasklist_after.txt; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "missing $f"
            fi
          done
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Ensure v0.3.0 release on main
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=v0.3.0
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Lia Desktop $TAG" --notes "WinUI 3 · DX11 · ATTA CORP"
          for f in LiaDesktop-0.3.0-win-x64.zip desktop_winui_front.png desktop_winui_rings.png tasklist_before.txt tasklist_after.txt; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
