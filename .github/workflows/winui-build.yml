name: WinUI Build & Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prefer .NET 8 SDK (WinAppSDK PriGen breaks on SDK 9+)
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramFiles\dotnet\sdk" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(9|10|11)\.' } |
            ForEach-Object {
              Write-Host "Removing SDK $($_.Name) to avoid PriGen MSB4062"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          dotnet --list-sdks
          dotnet --version

      - uses: microsoft/setup-msbuild@v2

      - name: Unit tests
        run: dotnet test LiaDesktop.WinUI/tests/LiaDesktop.Tests/LiaDesktop.Tests.csproj -c Release --nologo

      - name: Publish unpackaged self-contained
        shell: pwsh
        run: |
          $proj = "LiaDesktop.WinUI\src\LiaDesktop\LiaDesktop.csproj"
          $out = Join-Path $PWD "publish\LiaDesktop"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          msbuild $proj `
            /restore `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:TargetFramework=net8.0-windows10.0.19041.0 `
            /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:EnableMsixTooling=true `
            /p:AppxPackage=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:PublishReadyToRun=false `
            /p:PublishDir="$out\" `
            /p:PublishProtocol=FileSystem `
            /v:m
          if (-not (Test-Path (Join-Path $out "LiaDesktop.exe"))) { throw "LiaDesktop.exe missing after publish" }
          if (-not (Test-Path (Join-Path $out 'resources.pri'))) { Write-Warning "resources.pri missing" }
          Get-ChildItem $out -Filter 'resources.pri' | Format-Table Name,Length
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'

      - name: Shrink publish (locales / pdbs / Playwright non-Windows)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'publish\LiaDesktop'
          $before = (Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum
          # PDBs / XML docs
          Get-ChildItem $out -Recurse -Include *.pdb,*.xml -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'resources' } | Remove-Item -Force -ErrorAction SilentlyContinue
          # Culture satellite folders except en*
          Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^[a-z]{2}([-_][A-Za-z0-9]+)*$' -and $_.Name -notmatch '^en' } |
            ForEach-Object {
              Write-Host "rm culture $($_.FullName.Substring($out.Length))"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          # Playwright ships node for darwin/linux/win — keep win32_x64 only (~80MB).
          # Browsers are NOT bundled; runtime uses installed Edge (channel=msedge).
          $pwNode = Join-Path $out '.playwright\node'
          if (Test-Path $pwNode) {
            Get-ChildItem $pwNode -Directory | Where-Object { $_.Name -ne 'win32_x64' } | ForEach-Object {
              Write-Host "rm playwright node $($_.Name)"
              Remove-Item $_.FullName -Recurse -Force
            }
          }
          Get-ChildItem $out -Recurse -Directory -Filter '.local-browsers' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # Optional unused WinAppSDK bits (safe for this app — no widgets / WebView host)
          foreach ($pat in @('Microsoft.Windows.Widgets.dll','Microsoft.Windows.Widgets.winmd','Microsoft.DiaSymReader.Native.amd64.dll')) {
            $f = Join-Path $out $pat
            if (Test-Path $f) { Remove-Item $f -Force; Write-Host "rm $pat" }
          }
          $after = (Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("publish before={0:N0} after={1:N0} saved={2:N0}" -f $before,$after,($before-$after))
          if ($after -gt 280MB) { Write-Warning "publish still large: $after" }

      - name: Zip release (max compression)
        shell: pwsh
        run: |
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=9 LiaDesktop-0.7.0-win-x64.zip ".\publish\LiaDesktop\*" | Out-Host
          } else {
            Compress-Archive -Path publish/LiaDesktop/* -DestinationPath LiaDesktop-0.7.0-win-x64.zip -CompressionLevel Optimal -Force
          }
          Get-Item LiaDesktop-0.7.0-win-x64.zip | Format-List Name,Length

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $iscc /Q installer\LiaDesktop.iss
          $setup = Get-Item artifacts\LiaDesktop-0.7.0-setup.exe
          Copy-Item $setup.FullName .\LiaDesktop-0.7.0-setup.exe -Force
          $setup | Format-List Name,Length
          $zip = Get-Item LiaDesktop-0.7.0-win-x64.zip
          Write-Host ("SIZES zip={0:N0} setup={1:N0}" -f $zip.Length,$setup.Length)

      - name: E2E selftest (mock Gemini + optional live key)
        shell: pwsh
        env:
          # Optional — absent secrets are empty; never echo the value
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'publish/LiaDesktop/LiaDesktop.exe'
          if (-not (Test-Path $exe)) { throw "exe missing: $exe" }
          # Do NOT install edge-tts — C# WebSocket must work alone (selftest poisons PATH python)
          pip install --quiet pillow numpy
          $port = 18765
          $mock = Start-Process -FilePath python -ArgumentList @('tools/mock_gemini_server.py', "$port") -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/_control/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $ok) { throw "mock Gemini did not become healthy on :$port" }
            $out = Join-Path $PWD 'selftest.txt'
            if (Test-Path $out) { Remove-Item $out -Force }
            $hasLive = -not [string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)
            Write-Host "selftest live_key_present=$hasLive"
            $args = @(
              '--selftest',
              "--gemini-base=http://127.0.0.1:$port/v1beta",
              "--selftest-out=$out",
              '--smoke-size=1024x720'
            )
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru -WorkingDirectory (Split-Path $exe)
            $deadline = (Get-Date).AddMinutes(8)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2; $p.Refresh() }
            if (-not $p.HasExited) {
              try { $p.Kill($true) } catch {}
              throw "selftest timed out (>8min)"
            }
            if (Test-Path $out) { Get-Content $out | Out-Host } else { Write-Warning "selftest.txt missing" }
            if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }
            if (-not (Test-Path $out)) { throw "selftest.txt not written" }
            $txt = Get-Content $out -Raw
            if ($txt -notmatch 'SELFTEST PASS') { throw "selftest.txt missing PASS marker" }
            if ($txt -notmatch 'tts_ws_only: PASS') { throw "selftest missing tts_ws_only PASS" }
            if ($txt -notmatch 'tts_sapi: PASS') { throw "selftest missing tts_sapi PASS" }
            if ($txt -match 'operation was canceled') { throw "selftest reported canceled" }
            Write-Host "selftest ok (incl. tts_ws_only + tts_sapi)"
          }
          finally {
            try { Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue } catch {}
          }

      - name: Smoke launch + screenshots + clean exit proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'publish/LiaDesktop/LiaDesktop.exe'
          if (-not (Test-Path $exe)) { throw "exe missing: $exe" }

          $before = Join-Path $PWD 'tasklist_before.txt'
          $after = Join-Path $PWD 'tasklist_after.txt'
          "=== BEFORE LAUNCH ===" | Out-File $before
          tasklist | Select-String -Pattern 'LiaDesktop' | Out-File $before -Append

          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class Win {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr after, int x, int y, int cx, int cy, uint flags);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint flags);
            [DllImport("user32.dll")] public static extern int GetSystemMetrics(int n);
          }
          [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }
          "@
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing

          function Find-Hwnd([uint32]$procId) {
            $script:found = [IntPtr]::Zero
            $script:want = $procId
            # EnumWindows returns bool — must discard or PS returns Object[] with hwnd
            [void][Win]::EnumWindows({
              param($h,$l)
              $outPid = [uint32]0
              [void][Win]::GetWindowThreadProcessId($h, [ref]$outPid)
              if ($outPid -ne $script:want) { return $true }
              if (-not [Win]::IsWindowVisible($h)) { return $true }
              $script:found = $h
              return $false
            }, [IntPtr]::Zero)
            return [IntPtr]$script:found
          }

          function Capture-Window([IntPtr]$hwnd, [string]$path) {
            $rect = New-Object RECT
            if (-not [Win]::GetWindowRect($hwnd, [ref]$rect)) { throw "GetWindowRect failed" }
            $w = [Math]::Max(100, $rect.R - $rect.L)
            $h = [Math]::Max(100, $rect.B - $rect.T)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            # Prefer PrintWindow (works for oversized / partially off-screen windows)
            $ok = [Win]::PrintWindow($hwnd, $g.GetHdc(), 2)
            $g.ReleaseHdc()
            if (-not $ok) {
              $g.CopyFromScreen($rect.L, $rect.T, 0, 0, (New-Object System.Drawing.Size $w,$h))
            }
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "captured ${w}x${h} -> $path ($((Get-Item $path).Length) bytes)"
          }

          function Invoke-SmokeShot([string]$shotPath, [string[]]$smokeArgs, [int]$warm=10, [int]$forceW=0, [int]$forceH=0) {
            $bootLog = Join-Path $env:LOCALAPPDATA 'LiaDesktop\boot.log'
            if (Test-Path $bootLog) { Remove-Item $bootLog -Force }
            $args = @($smokeArgs)
            if ($forceW -gt 0 -and $forceH -gt 0) {
              $args += "--smoke-size=${forceW}x${forceH}"
            }
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru -WorkingDirectory (Split-Path $exe)
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) {
                if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
                throw "exited early code=$($p.ExitCode) smokeArgs=$($args -join ' ')"
              }
              $hwnd = Find-Hwnd ([uint32]$p.Id)
              if ($hwnd -ne [IntPtr]::Zero -and $i -ge ($warm - 1)) { break }
            }
            Start-Sleep -Seconds ([Math]::Max(2, $warm - 5))
            $hwnd = Find-Hwnd ([uint32]$p.Id)
            if ($hwnd -eq [IntPtr]::Zero) {
              if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
              throw "no hwnd for $($args -join ' ')"
            }
            if ($forceW -gt 0 -and $forceH -gt 0) {
              # Exact client-ish outer size; do NOT maximize (would break HiDPI framing tests)
              [void][Win]::ShowWindow($hwnd, 1) # SW_SHOWNORMAL
              [void][Win]::SetWindowPos($hwnd, [IntPtr]::Zero, 0, 0, $forceW, $forceH, 0x0040) # SWP_SHOWWINDOW
            } else {
              [void][Win]::ShowWindow($hwnd, 3)
            }
            Start-Sleep -Milliseconds 500
            [void][Win]::SetForegroundWindow($hwnd)
            Start-Sleep -Seconds 3
            Capture-Window $hwnd $shotPath
            "=== WHILE RUNNING ($($args -join ' ')) ===" | Out-File $after -Append
            tasklist | Select-String -Pattern 'LiaDesktop' | Out-File $after -Append
            [void][Win]::PostMessage($hwnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Seconds 6
            if (-not $p.HasExited) { try { $p.Kill($true) } catch {} }
            Start-Sleep -Seconds 2
            if (Test-Path $bootLog) {
              "`n=== BOOT ($($args -join ' ')) ===" | Out-File $after -Append
              Get-Content $bootLog | Out-File $after -Append
            }
          }

          "" | Out-File $after
          # Default maximize shots (pose matrix)
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_front.png') @('--smoke-yaw=5') 12
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_threequarter.png') @('--smoke-yaw=32') 10
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_profile.png') @('--smoke-yaw=82') 10
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_speaking.png') @('--smoke-yaw=12','--smoke-jaw=0.55') 10
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_eyes.png') @('--smoke-eyes','--smoke-yaw=0') 12
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_rings.png') @('--smoke-rings','--smoke-yaw=-48') 12
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_hud.png') @('--smoke-hud','--smoke-yaw=8') 12
          # HiDPI / large-TV framing: 1080p (=4K@200% DIP) and 4K physical
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_front_1080.png') @('--smoke-yaw=5') 10 1920 1080
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_front_4k.png') @('--smoke-yaw=5') 12 3840 2160

          # Layout matrix: 100% MUST reproduce small→maximize (field bug) + already-maximized.
          # Higher scales keep force-scale + windowed/max. Assert via check_framing assert_layout_shot.
          function Invoke-LayoutShot([string]$shotPath, [int]$forceW, [int]$forceH, [double]$scale, [string]$mode) {
            $bootLog = Join-Path $env:LOCALAPPDATA 'LiaDesktop\boot.log'
            if (Test-Path $bootLog) { Remove-Item $bootLog -Force }
            $scaleArg = "--force-scale=$($scale.ToString([System.Globalization.CultureInfo]::InvariantCulture))"
            # max / maxlaunch: start SMALL so swapchain must resize (TV field bug at 100%).
            # Do NOT use SW_MAXIMIZE — GHA virtual display is ~1024px; instead SetWindowPos
            # to the target 1920x1080 / 3840x2160 (PrintWindow captures off-screen full size).
            $launchW = if ($mode -eq 'windowed' -or $mode -eq 'maxlaunch') { $forceW } else { 1024 }
            $launchH = if ($mode -eq 'windowed' -or $mode -eq 'maxlaunch') { $forceH } else { 720 }
            $args = @('--smoke-yaw=5', $scaleArg, "--smoke-size=${launchW}x${launchH}")
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru -WorkingDirectory (Split-Path $exe)
            for ($i = 0; $i -lt 28; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) {
                if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
                throw "layout exited early code=$($p.ExitCode) $shotPath"
              }
              $hwnd = Find-Hwnd ([uint32]$p.Id)
              if ($hwnd -ne [IntPtr]::Zero -and $i -ge 8) { break }
            }
            Start-Sleep -Seconds 2
            $hwnd = Find-Hwnd ([uint32]$p.Id)
            if ($hwnd -eq [IntPtr]::Zero) { throw "no hwnd for $shotPath" }
            [void][Win]::ShowWindow($hwnd, 1) # SW_SHOWNORMAL — avoid display-clamped maximize
            if ($mode -eq 'max') {
              # Settle at small size first (stale-buffer repro), then jump to target res
              [void][Win]::SetWindowPos($hwnd, [IntPtr]::Zero, 40, 40, 1024, 720, 0x0040)
              Start-Sleep -Seconds 3
              [void][Win]::SetWindowPos($hwnd, [IntPtr]::Zero, 0, 0, $forceW, $forceH, 0x0040)
              Start-Sleep -Seconds 5
            } elseif ($mode -eq 'maxlaunch') {
              # Already at target smoke-size; re-assert outer size after show
              [void][Win]::SetWindowPos($hwnd, [IntPtr]::Zero, 0, 0, $forceW, $forceH, 0x0040)
              Start-Sleep -Seconds 4
            } else {
              [void][Win]::SetWindowPos($hwnd, [IntPtr]::Zero, 0, 0, $forceW, $forceH, 0x0040)
              Start-Sleep -Seconds 3
            }
            [void][Win]::SetForegroundWindow($hwnd)
            Start-Sleep -Seconds 2
            Capture-Window $hwnd $shotPath
            $rect = New-Object RECT
            [void][Win]::GetWindowRect($hwnd, [ref]$rect)
            $gotW = $rect.R - $rect.L
            $gotH = $rect.B - $rect.T
            Write-Host "layout hwnd ${gotW}x${gotH} target ${forceW}x${forceH} mode=$mode"
            # PrintWindow should match hwnd; require near-target so we don't silently test 1024px
            if ($gotW -lt [int]($forceW * 0.85) -or $gotH -lt [int]($forceH * 0.85)) {
              if (Test-Path $bootLog) { Get-Content $bootLog | Select-String 'SwapChain' | Out-Host }
              throw "$shotPath hwnd ${gotW}x${gotH} << target ${forceW}x${forceH}"
            }
            if (Test-Path $bootLog) {
              Write-Host "=== BOOT $shotPath ==="
              Get-Content $bootLog | Select-String -Pattern 'SwapChain' | Select-Object -Last 8 | Out-Host
            }
            [void][Win]::PostMessage($hwnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Seconds 5
            if (-not $p.HasExited) { try { $p.Kill($true) } catch {} }
            Start-Sleep -Seconds 1
            $len = (Get-Item $shotPath).Length
            if ($len -lt 30000) { throw "$shotPath too small ($len)" }
            Write-Host "layout ok $shotPath ($len bytes)"
          }

          # 100% scale first — the field-test failure mode
          foreach ($res in @(@(1920,1080,'1080'), @(3840,2160,'4k'))) {
            $rw = [int]$res[0]; $rh = [int]$res[1]; $rname = [string]$res[2]
            Invoke-LayoutShot (Join-Path $PWD "layout_${rname}_100_windowed.png") $rw $rh 1.0 'windowed'
            Invoke-LayoutShot (Join-Path $PWD "layout_${rname}_100_max.png") $rw $rh 1.0 'max'
            Invoke-LayoutShot (Join-Path $PWD "layout_${rname}_100_maxlaunch.png") $rw $rh 1.0 'maxlaunch'
          }
          # Remaining DPI scales (windowed + small→max)
          foreach ($sc in @(1.5, 2.0, 2.5, 3.0)) {
            $tag = ([int]($sc * 100)).ToString()
            foreach ($res in @(@(1920,1080,'1080'), @(3840,2160,'4k'))) {
              $rw = [int]$res[0]; $rh = [int]$res[1]; $rname = [string]$res[2]
              Invoke-LayoutShot (Join-Path $PWD "layout_${rname}_${tag}_windowed.png") $rw $rh $sc 'windowed'
              Invoke-LayoutShot (Join-Path $PWD "layout_${rname}_${tag}_max.png") $rw $rh $sc 'max'
            }
          }

          "`n=== AFTER CLOSE ===" | Out-File $after -Append
          $left = tasklist | Select-String -Pattern 'LiaDesktop|Lia Assistant'
          $left | Out-File $after -Append
          if ($left -match 'LiaDesktop') { throw "LiaDesktop still running after close" }
          "OK: no LiaDesktop processes remain" | Out-File $after -Append
          Get-Content $after

          foreach ($f in @('desktop_winui_front.png','desktop_winui_threequarter.png','desktop_winui_profile.png','desktop_winui_speaking.png','desktop_winui_eyes.png','desktop_winui_rings.png','desktop_winui_hud.png','desktop_winui_front_1080.png','desktop_winui_front_4k.png')) {
            $len = (Get-Item $f).Length
            if ($len -lt 40000) { throw "$f too small ($len) — likely blank/error dialog" }
          }
          $h3 = (Get-FileHash desktop_winui_threequarter.png).Hash
          $hr = (Get-FileHash desktop_winui_rings.png).Hash
          if ($h3 -eq $hr) { throw "threequarter and rings screenshots are identical — need distinct views" }
          pip install --quiet pillow numpy
          # Gate 100% maximize shots first (field bug)
          python tools/check_framing.py `
            layout_1080_100_max.png layout_1080_100_maxlaunch.png `
            layout_4k_100_max.png layout_4k_100_maxlaunch.png `
            desktop_winui_front_1080.png desktop_winui_front_4k.png
          if ($LASTEXITCODE -ne 0) { throw "framing self-check failed (100% maximize)" }
          $layoutCount = (Get-ChildItem layout_*.png -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($layoutCount -lt 22) { throw "expected >=22 layout_*.png, got $layoutCount" }
          Write-Host "smoke ok (layout shots=$layoutCount)"

      - name: Installer silent install / uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'LiaDesktop-0.7.0-setup.exe'
          if (-not (Test-Path $setup)) { throw "setup missing" }
          $dir = Join-Path $env:LOCALAPPDATA 'LiaDesktop-smoke'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          # Inno silent: /VERYSILENT /DIR= /NORESTART /SUPPRESSMSGBOXES
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $exe = Join-Path $dir 'LiaDesktop.exe'
          if (-not (Test-Path $exe)) { throw "installed exe missing" }
          Write-Host "installed ok -> $exe"
          # Uninstall via unins000.exe
          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $unins) { throw "uninstaller missing" }
          $u = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 2
          Write-Host "uninstall exit=$($u.ExitCode)"
          "OK: installer silent install+uninstall" | Out-File tasklist_after.txt -Append
          Get-Content tasklist_after.txt | Select-Object -Last 5

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: winui-smoke-${{ github.run_id }}
          path: |
            LiaDesktop-0.7.0-win-x64.zip
            LiaDesktop-0.7.0-setup.exe
            desktop_winui_front.png
