name: WinUI Build & Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prefer .NET 8 SDK (WinAppSDK PriGen breaks on SDK 9+)
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramFiles\dotnet\sdk" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(9|10|11)\.' } |
            ForEach-Object {
              Write-Host "Removing SDK $($_.Name) to avoid PriGen MSB4062"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          dotnet --list-sdks
          dotnet --version

      - uses: microsoft/setup-msbuild@v2

      - name: Unit tests
        run: dotnet test LiaDesktop.WinUI/tests/LiaDesktop.Tests/LiaDesktop.Tests.csproj -c Release --nologo

      - name: Publish unpackaged self-contained
        shell: pwsh
        run: |
          $proj = "LiaDesktop.WinUI\src\LiaDesktop\LiaDesktop.csproj"
          $out = Join-Path $PWD "publish\LiaDesktop"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          msbuild $proj `
            /restore `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:TargetFramework=net8.0-windows10.0.19041.0 `
            /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:EnableMsixTooling=true `
            /p:AppxPackage=false `
            /p:GenerateAppxPackageOnBuild=false `
            /p:PublishReadyToRun=false `
            /p:PublishDir="$out\" `
            /p:PublishProtocol=FileSystem `
            /v:m
          if (-not (Test-Path (Join-Path $out "LiaDesktop.exe"))) { throw "LiaDesktop.exe missing after publish" }
          if (-not (Test-Path (Join-Path $out 'resources.pri'))) { Write-Warning "resources.pri missing" }
          Get-ChildItem $out -Filter 'resources.pri' | Format-Table Name,Length
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'

      - name: Shrink publish (locales / pdbs / Playwright non-Windows)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'publish\LiaDesktop'
          $before = (Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum
          # PDBs / XML docs
          Get-ChildItem $out -Recurse -Include *.pdb,*.xml -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'resources' } | Remove-Item -Force -ErrorAction SilentlyContinue
          # Culture satellite folders except en*
          Get-ChildItem $out -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^[a-z]{2}([-_][A-Za-z0-9]+)*$' -and $_.Name -notmatch '^en' } |
            ForEach-Object {
              Write-Host "rm culture $($_.FullName.Substring($out.Length))"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          # Playwright ships node for darwin/linux/win — keep win32_x64 only (~80MB).
          # Browsers are NOT bundled; runtime uses installed Edge (channel=msedge).
          $pwNode = Join-Path $out '.playwright\node'
          if (Test-Path $pwNode) {
            Get-ChildItem $pwNode -Directory | Where-Object { $_.Name -ne 'win32_x64' } | ForEach-Object {
              Write-Host "rm playwright node $($_.Name)"
              Remove-Item $_.FullName -Recurse -Force
            }
          }
          Get-ChildItem $out -Recurse -Directory -Filter '.local-browsers' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # Optional unused WinAppSDK bits (safe for this app — no widgets / WebView host)
          foreach ($pat in @('Microsoft.Windows.Widgets.dll','Microsoft.Windows.Widgets.winmd','Microsoft.DiaSymReader.Native.amd64.dll')) {
            $f = Join-Path $out $pat
            if (Test-Path $f) { Remove-Item $f -Force; Write-Host "rm $pat" }
          }
          $after = (Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("publish before={0:N0} after={1:N0} saved={2:N0}" -f $before,$after,($before-$after))
          if ($after -gt 280MB) { Write-Warning "publish still large: $after" }

      - name: Zip release (max compression)
        shell: pwsh
        run: |
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=9 LiaDesktop-0.6.3-win-x64.zip ".\publish\LiaDesktop\*" | Out-Host
          } else {
            Compress-Archive -Path publish/LiaDesktop/* -DestinationPath LiaDesktop-0.6.3-win-x64.zip -CompressionLevel Optimal -Force
          }
          Get-Item LiaDesktop-0.6.3-win-x64.zip | Format-List Name,Length

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $iscc /Q installer\LiaDesktop.iss
          $setup = Get-Item artifacts\LiaDesktop-0.6.3-setup.exe
          Copy-Item $setup.FullName .\LiaDesktop-0.6.3-setup.exe -Force
          $setup | Format-List Name,Length
          $zip = Get-Item LiaDesktop-0.6.3-win-x64.zip
          Write-Host ("SIZES zip={0:N0} setup={1:N0}" -f $zip.Length,$setup.Length)

      - name: Smoke launch + screenshots + clean exit proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'publish/LiaDesktop/LiaDesktop.exe'
          if (-not (Test-Path $exe)) { throw "exe missing: $exe" }

          $before = Join-Path $PWD 'tasklist_before.txt'
          $after = Join-Path $PWD 'tasklist_after.txt'
          "=== BEFORE LAUNCH ===" | Out-File $before
          tasklist | Select-String -Pattern 'LiaDesktop' | Out-File $before -Append

          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class Win {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
          }
          [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }
          "@
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing

          function Find-Hwnd([uint32]$procId) {
            $script:found = [IntPtr]::Zero
            $script:want = $procId
            # EnumWindows returns bool — must discard or PS returns Object[] with hwnd
            [void][Win]::EnumWindows({
              param($h,$l)
              $outPid = [uint32]0
              [void][Win]::GetWindowThreadProcessId($h, [ref]$outPid)
              if ($outPid -ne $script:want) { return $true }
              if (-not [Win]::IsWindowVisible($h)) { return $true }
              $script:found = $h
              return $false
            }, [IntPtr]::Zero)
            return [IntPtr]$script:found
          }

          function Capture-Window([IntPtr]$hwnd, [string]$path) {
            $rect = New-Object RECT
            if (-not [Win]::GetWindowRect($hwnd, [ref]$rect)) { throw "GetWindowRect failed" }
            $w = [Math]::Max(100, $rect.R - $rect.L)
            $h = [Math]::Max(100, $rect.B - $rect.T)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($rect.L, $rect.T, 0, 0, (New-Object System.Drawing.Size $w,$h))
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "captured ${w}x${h} -> $path ($((Get-Item $path).Length) bytes)"
          }

          function Invoke-SmokeShot([string]$shotPath, [string[]]$smokeArgs, [int]$warm=10) {
            $bootLog = Join-Path $env:LOCALAPPDATA 'LiaDesktop\boot.log'
            if (Test-Path $bootLog) { Remove-Item $bootLog -Force }
            $p = Start-Process -FilePath $exe -ArgumentList $smokeArgs -PassThru -WorkingDirectory (Split-Path $exe)
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) {
                if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
                throw "exited early code=$($p.ExitCode) smokeArgs=$($smokeArgs -join ' ')"
              }
              $hwnd = Find-Hwnd ([uint32]$p.Id)
              if ($hwnd -ne [IntPtr]::Zero -and $i -ge ($warm - 1)) { break }
            }
            Start-Sleep -Seconds ([Math]::Max(2, $warm - 5))
            $hwnd = Find-Hwnd ([uint32]$p.Id)
            if ($hwnd -eq [IntPtr]::Zero) {
              if (Test-Path $bootLog) { Get-Content $bootLog | Out-Host }
              throw "no hwnd for $($smokeArgs -join ' ')"
            }
            [void][Win]::ShowWindow($hwnd, 3)
            Start-Sleep -Milliseconds 400
            [void][Win]::SetForegroundWindow($hwnd)
            Start-Sleep -Seconds 3
            Capture-Window $hwnd $shotPath
            # While-running proof (last shot)
            "=== WHILE RUNNING ($($smokeArgs -join ' ')) ===" | Out-File $after -Append
            tasklist | Select-String -Pattern 'LiaDesktop' | Out-File $after -Append
            [void][Win]::PostMessage($hwnd, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Seconds 6
            if (-not $p.HasExited) { try { $p.Kill($true) } catch {} }
            Start-Sleep -Seconds 2
            if (Test-Path $bootLog) {
              "`n=== BOOT ($($smokeArgs -join ' ')) ===" | Out-File $after -Append
              Get-Content $bootLog | Out-File $after -Append
            }
          }

          "" | Out-File $after
          # Front, 3/4, profile, speaking, eyes close-up, rings
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_front.png') @('--smoke-yaw=5') 12
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_threequarter.png') @('--smoke-yaw=32') 10
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_profile.png') @('--smoke-yaw=82') 10
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_speaking.png') @('--smoke-yaw=12','--smoke-jaw=0.55') 10
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_eyes.png') @('--smoke-eyes','--smoke-yaw=0') 12
          # Distinct rings view (must NOT be a copy of threequarter)
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_rings.png') @('--smoke-rings','--smoke-yaw=-48') 12
          # Full-window cinematic HUD (listening waveform + glass cards)
          Invoke-SmokeShot (Join-Path $PWD 'desktop_winui_hud.png') @('--smoke-hud','--smoke-yaw=8') 12

          "`n=== AFTER CLOSE ===" | Out-File $after -Append
          $left = tasklist | Select-String -Pattern 'LiaDesktop|Lia Assistant'
          $left | Out-File $after -Append
          if ($left -match 'LiaDesktop') { throw "LiaDesktop still running after close" }
          "OK: no LiaDesktop processes remain" | Out-File $after -Append
          Get-Content $after

          # Basic visual QA: shots must not be tiny / near-white
          foreach ($f in @('desktop_winui_front.png','desktop_winui_threequarter.png','desktop_winui_profile.png','desktop_winui_speaking.png','desktop_winui_eyes.png','desktop_winui_rings.png','desktop_winui_hud.png')) {
            $len = (Get-Item $f).Length
            if ($len -lt 40000) { throw "$f too small ($len) — likely blank/error dialog" }
          }
          $h3 = (Get-FileHash desktop_winui_threequarter.png).Hash
          $hr = (Get-FileHash desktop_winui_rings.png).Hash
          if ($h3 -eq $hr) { throw "threequarter and rings screenshots are identical — need distinct views" }
          # Framing self-check: head ~70-75% of viewport height
          pip install --quiet pillow numpy
          python tools/check_framing.py
          if ($LASTEXITCODE -ne 0) { throw "framing self-check failed" }
          Write-Host "smoke ok"

      - name: Installer silent install / uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'LiaDesktop-0.6.3-setup.exe'
          if (-not (Test-Path $setup)) { throw "setup missing" }
          $dir = Join-Path $env:LOCALAPPDATA 'LiaDesktop-smoke'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          # Inno silent: /VERYSILENT /DIR= /NORESTART /SUPPRESSMSGBOXES
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit $($p.ExitCode)" }
          $exe = Join-Path $dir 'LiaDesktop.exe'
          if (-not (Test-Path $exe)) { throw "installed exe missing" }
          Write-Host "installed ok -> $exe"
          # Uninstall via unins000.exe
          $unins = Get-ChildItem $dir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $unins) { throw "uninstaller missing" }
          $u = Start-Process -FilePath $unins.FullName -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 2
          Write-Host "uninstall exit=$($u.ExitCode)"
          "OK: installer silent install+uninstall" | Out-File tasklist_after.txt -Append
          Get-Content tasklist_after.txt | Select-Object -Last 5

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: winui-smoke-${{ github.run_id }}
          path: |
            LiaDesktop-0.6.3-win-x64.zip
            LiaDesktop-0.6.3-setup.exe
            desktop_winui_front.png
            desktop_winui_threequarter.png
            desktop_winui_profile.png
            desktop_winui_speaking.png
            desktop_winui_eyes.png
            desktop_winui_rings.png
            desktop_winui_hud.png
            tasklist_before.txt
            tasklist_after.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload smoke PNGs for QA (tags, even if framing fails)
        if: always() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Lia Desktop $TAG" --notes "CI smoke PNGs (draft until HUD QA)"
          for f in desktop_winui_front.png desktop_winui_threequarter.png desktop_winui_profile.png \
                   desktop_winui_speaking.png desktop_winui_eyes.png desktop_winui_rings.png desktop_winui_hud.png; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
          done

      - name: Upload release assets (tags) — DRAFT until visual HUD QA
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          Lia Desktop **v0.6.3** — soft neck dissolve, crown halo, chin ring in-frame

          - Smooth vertical neck alpha (no hard stump / shoulder notch)
          - Crown halo above/behind head; lower ring below chin inside viewport
          - See THIRD_PARTY_NOTICES.md

          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Lia Desktop $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Lia Desktop $TAG" --notes "$NOTES"
          fi
          for f in LiaDesktop-0.6.3-win-x64.zip LiaDesktop-0.6.3-setup.exe \
                   desktop_winui_front.png desktop_winui_threequarter.png desktop_winui_profile.png \
                   desktop_winui_speaking.png desktop_winui_eyes.png desktop_winui_rings.png desktop_winui_hud.png \
                   tasklist_before.txt tasklist_after.txt; do
            if [ -f "$f" ]; then
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "missing $f"
            fi
          done
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG} (draft)"

      - name: Mirror assets to draft v0.6.3 on main pushes
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=v0.6.3
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Lia Desktop $TAG" --notes "Cinematic HUD v0.6.3 (draft)"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft || true
          for f in LiaDesktop-0.6.3-win-x64.zip LiaDesktop-0.6.3-setup.exe desktop_winui_front.png desktop_winui_threequarter.png desktop_winui_profile.png desktop_winui_speaking.png desktop_winui_eyes.png desktop_winui_rings.png desktop_winui_hud.png tasklist_after.txt; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
