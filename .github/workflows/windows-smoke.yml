name: Windows EXE smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'cursor/**']

jobs:
  smoke:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - name: Pack portable
        run: |
          npm install
          npm run pack:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Launch and screenshot
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "release" -Filter "LiaAssistant-*-win-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "portable exe not found" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class Win {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc lpEnumFunc, IntPtr lParam);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
          }
          "@
          $script:target = [IntPtr]::Zero
          [Win]::EnumWindows({
            param($h,$l)
            if (-not [Win]::IsWindowVisible($h)) { return $true }
            $sb = New-Object System.Text.StringBuilder 256
            [void][Win]::GetWindowText($h, $sb, $sb.Capacity)
            if ($sb.ToString() -like "*Lia Assistant*") { $script:target = $h; return $false }
            return $true
          }, [IntPtr]::Zero)
          if ($script:target -ne [IntPtr]::Zero) {
            [void][Win]::ShowWindow($script:target, 3)
            Start-Sleep -Milliseconds 500
            [void][Win]::SetForegroundWindow($script:target)
            Start-Sleep -Seconds 2
          }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $out = Join-Path $env:GITHUB_WORKSPACE "desktop_windows_runner.png"
          $bmp.Save($out, [System.Drawing.Imaging.ImageFormat]::Png)
          Get-Process | Where-Object { $_.ProcessName -match "Lia|electron" } | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $out)) { throw "screenshot missing" }
          Write-Host "screenshot ok size=$((Get-Item $out).Length) focused=$($script:target -ne [IntPtr]::Zero)"
      # Prefer release asset over Actions artifacts (account artifact quota exhausted)
      - name: Attach screenshot to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          if [ -z "$TAG" ]; then TAG=v0.2.0; fi
          gh release upload "$TAG" desktop_windows_runner.png --repo "$GITHUB_REPOSITORY" --clobber
          echo "uploaded desktop_windows_runner.png → $TAG"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lia-windows-smoke
          path: desktop_windows_runner.png
          retention-days: 7
          if-no-files-found: error